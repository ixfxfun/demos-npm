<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>particle-agents</title>
</head>

<body>
  <script type="importmap">{ "imports": { "@ixfx":"/ixfx/core.js", "@ixfx/": "/ixfx/" } }</script>
  <style>
    *,
    *:before,
    *:after,
    html,
    body {
      box-sizing: border-box;
 
    }

    html,body {
           height:100%;
      width:100%;
    }
    :root {
      --hue: 10;
      --mono-font: Consolas, "Andale Mono WT", "Andale Mono", "Lucida Console", "Lucida Sans Typewriter", "DejaVu Sans Mono", "Bitstream Vera Sans Mono", "Liberation Mono", "Nimbus Mono L", Monaco, "Courier New", Courier, monospace;

      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      --bg: hsl(var(--hue), 10%, 80%);
      --fg: hsl(var(--hue), 100%, 30%);
    }


    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
     
      overflow:hidden;
      touch-action: none;

      padding:0;
      margin:0;
    }

    #debug {
      background:black;
      color:white;
      font-family: var(--mono-font);
      font-size: 2em;
      pointer-events: none;
      user-select: none;
      z-index:10;
      position: fixed;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      touch-action: none;
      pointer-events: none;

    }
  </style>
  <canvas id="canvas"></canvas>
  <section>
    <div id="debug">
    </div>
    <script type="module" src="script.js"></script>
  </section>
</body>

</html>
